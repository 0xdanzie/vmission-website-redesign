<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="piyushBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8EE" />
      <stop offset="60%" stop-color="#F7EEE4" />
      <stop offset="100%" stop-color="#EEDAC5" />
    </linearGradient>
    <linearGradient id="goldBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9B783E" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#piyushBg)" />
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#C5A059" stroke-width="2" />
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#D95D39" stroke-width="1" opacity="0.3" />

  <!-- Top Metadata Bar -->
  <rect x="35" y="40" width="530" height="30" fill="#2E4839" rx="3" />
  <text x="50" y="60" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E8D28A" letter-spacing="1.5">वर्ष २४ · अंक ८</text>
  <text x="550" y="60" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FAF5EE" text-anchor="end" letter-spacing="1.5">सितम्बर २०२६</text>

  <!-- Masthead -->
  <g transform="translate(300, 140)">
    <circle cx="0" cy="-20" r="28" fill="none" stroke="#D95D39" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="0" y="-12" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="700" fill="#D95D39" text-anchor="middle">ॐ</text>

    <text x="0" y="45" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#221D1A" text-anchor="middle" letter-spacing="2">
      वेदान्त पीयूष
    </text>
    <text x="0" y="75" font-family="'Cinzel', serif" font-size="16" font-weight="600" fill="#9E381C" text-anchor="middle" letter-spacing="3">
      VEDANTA PIYUSH
    </text>
    <text x="0" y="98" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#5E564F" text-anchor="middle" letter-spacing="2">
      HINDI &amp; GUJARATI SPIRITUAL MONTHLY
    </text>
  </g>

  <!-- Center Framing -->
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="440" height="320" fill="#201C1A" rx="8" stroke="#C5A059" stroke-width="2" />
    
    <text x="220" y="70" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#E8D28A" text-anchor="middle" font-style="italic">
      &ldquo;ईशा वास्यमिदं सर्वम्&rdquo;
    </text>

    <!-- Main Feature -->
    <rect x="30" y="120" width="380" height="150" fill="rgba(255,255,255,0.05)" rx="6" stroke="#D95D39" stroke-width="1" />
    <text x="220" y="155" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#D95D39" text-anchor="middle" letter-spacing="2">
      मुख्य आलेख
    </text>
    <text x="220" y="195" font-family="'Cormorant Garamond', serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      श्रीमद्भगवद्गीता — ज्ञानयोग एवं कर्मसंन्यास
    </text>
    <text x="220" y="235" font-family="'Inter', sans-serif" font-size="13" fill="#DBC082" text-anchor="middle">
      पूज्य स्वामी आत्मानन्द सरस्वती
    </text>
  </g>

  <!-- Content Highlights -->
  <g transform="translate(80, 620)">
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#9E381C" letter-spacing="1.5">इस अंक में विशेष:</text>
    <text x="0" y="45" font-family="'Inter', sans-serif" font-size="13" fill="#221D1A">• उपनिषद् सार — आत्म-साक्षात्कार का मार्ग</text>
    <text x="0" y="70" font-family="'Inter', sans-serif" font-size="13" fill="#221D1A">• आश्रम समाचार — गुरु पूर्णिमा महोत्सव वृत्तान्त</text>
    <text x="0" y="95" font-family="'Inter', sans-serif" font-size="13" fill="#221D1A">• साधक प्रश्नोत्तरी — मन की एकाग्रता कैसे प्राप्त करें?</text>
  </g>

  <!-- Footer -->
  <rect x="20" y="740" width="560" height="40" fill="url(#goldBanner)" />
  <text x="300" y="765" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    वेदान्त आश्रम · सुदामा नगर, इन्दौर (म.प्र.)
  </text>
</svg>
